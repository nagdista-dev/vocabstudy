<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Nagdista">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#f3f5f9">
<meta property="og:title" content="VocabStudy">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://vocabstudy.nagdista.com/assets/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VocabStudy — keep every English word you meet.">
<meta property="og:url" content="https://vocabstudy.nagdista.com/">
<meta name="twitter:card" content="summary_large_image">
<title>{{TITLE}}</title>
<link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="{{ROOT}}manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ROOT}}assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VocabStudy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Night before the first paint (V6): same rule as applyTheme() in app.js. */
try { var s = JSON.parse(localStorage.getItem("vocabstudy") || "{}").settings || {}, t = s.theme || "light";
  /* Light unless the learner chose Night, or chose Auto on a dark device. */
  if (t === "night" || (t === "auto" && s.themeChosen && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "night";
} catch (e) {}
</script>
{{STYLES}}
</head>
<body{{BODY_ATTRS}}>
<!-- {{GENERATED_NOTE}} -->
<a class="skip-link" href="#view">Skip to content</a>
<header class="app-bar">
  <div class="app-bar-inner">
    <a class="brand" id="brandLink" href="{{ROOT}}./"><span>VocabStudy</span></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="bar-actions">
      <nav class="bar-nav" id="barNav" aria-label="Main"></nav>
      <a class="bar-community" id="communityBtn" href="#" target="_blank" rel="noopener" aria-label="Join the VocabStudy WhatsApp community" title="Join the community on WhatsApp"></a>
      <button class="icon-btn more-btn" id="moreBtn" type="button" data-action="open-more" aria-label="More — progress, share and settings" aria-haspopup="dialog" title="More"></button>
      <button class="icon-btn share-app-btn" id="shareAppBtn" type="button" data-action="share-app" aria-label="Share VocabStudy — send it to a friend" title="Share VocabStudy"></button>
      <button class="icon-btn" id="settingsBtn" type="button" data-action="open-settings" aria-label="Settings" title="Settings"></button>
    </div>
  </div>
</header>
<main id="view" tabindex="-1">
  <noscript><p class="page">VocabStudy needs JavaScript to run.</p></noscript>
</main>
<nav class="tab-bar" id="tabBar" aria-label="Main"></nav>
<dialog class="sheet" id="settings" aria-labelledby="settingsTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- App core, the screens, then app.js boots it all. -->
{{SCRIPTS}}
</body>
</html>
