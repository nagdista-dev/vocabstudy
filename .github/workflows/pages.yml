# Builds the public website (the app ships with no words) and publishes it to GitHub Pages.
# Learners' own words live only in their browser, so they are never part of the site.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build.py knows which files the app needs (SITE_FILES) and puts them in _site/,
      # then runs the app check and the SEO/GEO check. A red check blocks the deploy.
      - name: Check and build
        run: python3 tools/build.py --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
